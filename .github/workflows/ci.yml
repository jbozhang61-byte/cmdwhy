name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install coverage
        run: python -m pip install --upgrade pip 'coverage>=7.0,<7.7'
      - name: Compile
        run: python -m compileall -q cmdwhy tests
      - name: Tests with coverage
        run: |
          coverage run --source=cmdwhy -m unittest discover -s tests
          coverage report -m --fail-under=50

  shellcheck:
    name: shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck and shells
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh fish
      - name: Check bash hook
        run: |
          python -m cmdwhy hook install --print --shell bash > /tmp/hook.bash
          bash -n /tmp/hook.bash
          shellcheck -s bash -S error /tmp/hook.bash
      - name: Check zsh hook
        run: |
          python -m cmdwhy hook install --print --shell zsh > /tmp/hook.zsh
          zsh -n /tmp/hook.zsh
      - name: Check fish hook
        run: |
          python -m cmdwhy hook install --print --shell fish > /tmp/hook.fish
          fish -n /tmp/hook.fish
      - name: Check install script
        run: |
          bash -n install.sh
          shellcheck -s bash -S error install.sh

  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
          - name: Arch Linux
            image: archlinux:latest
          - name: Fedora latest
            image: fedora:latest
          - name: AlmaLinux 9
            image: almalinux:9
          - name: Alpine latest
            image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and git
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y python3 python3-pip python3-venv git bash
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm --needed python python-pip git bash
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y python3 python3-pip git bash
          elif command -v yum >/dev/null 2>&1; then
            yum install -y python3 python3-pip git bash
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive install python3 python3-pip git bash
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3 py3-pip git bash
          fi
      - name: Tests
        run: python3 -m unittest discover -s tests
