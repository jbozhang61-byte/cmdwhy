[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdwhy"
version = "0.6.0"
description = "让 shell 历史自己解释自己：工作环境、动机、报错与修复链，附输入错误自动纠正"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "cmdwhy contributors"}]
keywords = ["shell", "history", "bash", "zsh", "devops", "cli", "ubuntu"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Shells",
]
dependencies = []

[project.scripts]
cmdwhy = "cmdwhy.cli:main"
cw = "cmdwhy.cli:cw_main"

[tool.setuptools]
packages = ["cmdwhy"]
